# Monitoring für die Vogel-Kamera: Prometheus sammelt die Messwerte des pi-daemon,
# Grafana zeigt sie als Dashboard.
#
# Diese Datei ist für den Betrieb auf einem ANDEREN Rechner im Heimnetz (Variante B):
# die Verläufe bleiben sichtbar, wenn der Pi aus ist. Für das Monitoring direkt auf dem Pi
# (Variante A) genügt PI_MONITORING=true in ansible/.env – siehe README.md.
#
# Einrichtung: siehe README.md in diesem Verzeichnis. Kurzfassung:
#   cp .env.example .env                      # GRAFANA_ADMIN_PASSWORD setzen
#   cp prometheus/targets/kamera.yml.example prometheus/targets/kamera.yml
#   Token und Zertifikat nach prometheus/secrets/ legen
#   docker compose up -d
# Grafana: http://<dieser-rechner>:${GRAFANA_PORT:-3002}  (Benutzer "admin")
name: vogelkamera-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: vogelkamera-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-180d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - ./prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    # Web-Oberfläche nur auf diesem Rechner (zum Prüfen von Abfragen); Grafana spricht intern.
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    container_name: vogelkamera-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD in .env setzen}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Keine Zusatz-Plugins beim Start nachladen (sonst ~380 MB Download und langsamer Start)
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/vogelkamera.json
      GF_DEFAULT_LOCALE: de-DE
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
