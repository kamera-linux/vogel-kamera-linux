---
name: Bug Report
description: Report a bug or issue with vogel-kamera-linux
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve the bird camera system! Please complete the form below to
        report this bug.

  - type: dropdown
    id: version
    attributes:
      label: Version
      description: Which version of vogel-kamera-linux are you using?
      options:
        - v2.0.1
        - v2.0.0
        - v1.3.x
        - Other (please specify)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "Example: Camera stream freezes after 5 minutes of recording"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Start the unified-camera-monitor
        2. Enable AI detection
        3. Record for 5+ minutes
        4. Observe the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: "Example: The camera should continue recording without interruption"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: "Example: The stream freezes or the application exits"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What device are you running this on?
      options:
        - Raspberry Pi 5
        - Raspberry Pi 4
        - Remote Client (Linux)
        - Remote Client (macOS)
        - Remote Client (Windows)
        - Other
    validations:
      required: true

  - type: textarea
    id: os
    attributes:
      label: Operating System Details
      description: Output of `uname -a` on Raspberry Pi
      render: shell

  - type: textarea
    id: python
    attributes:
      label: Python Version
      description: Output of `python3 --version`
      render: shell

  - type: textarea
    id: camera
    attributes:
      label: Camera Information
      description: Output of `libcamera-hello --help | head -20` and which camera model
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Error Messages or Logs
      description: Please paste any error messages or relevant output
      render: bash

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might be helpful

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I've tested with `--dry-run` mode
          required: false
        - label: I'm using the latest version
          required: false
        - label: The issue is reproducible
          required: true
