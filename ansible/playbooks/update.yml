---
# Nur das Docker-Image austauschen (kein Docker-Reinstall, kein SSL-Reset):
#   ansible-playbook playbooks/update.yml --ask-vault-pass
#
# Dieses Playbook wird von build_and_deploy.sh --update aufgerufen.

- name: Pi-Daemon Image-Update
  hosts: all
  gather_facts: false

  vars_files:
    - ../group_vars/all/vars.yml
    - ../group_vars/all/vault.yml

  tasks:
    - name: Prüfen ob Image-Archiv vorhanden (SCP-Upload durch build_and_deploy.sh)
      ansible.builtin.stat:
        path: /tmp/vogel-pi.tar.gz
      register: image_archive

    - name: Docker-Image laden
      ansible.builtin.command:
        cmd: docker load -i /tmp/vogel-pi.tar.gz
      become: true
      when: image_archive.stat.exists

    - name: Image-Archiv aufräumen
      ansible.builtin.file:
        path: /tmp/vogel-pi.tar.gz
        state: absent
      when: image_archive.stat.exists

    - name: .env aktualisieren (Secrets)
      ansible.builtin.template:
        src:   ../roles/pi-daemon/templates/env.j2
        dest:  "{{ pi_daemon_dir }}/.env"
        owner: "{{ pi_user }}"
        group: "{{ pi_user }}"
        mode:  "0600"
      no_log: true

    - name: docker-compose.yml aktualisieren
      ansible.builtin.template:
        src:   ../roles/pi-daemon/templates/docker-compose.yml.j2
        dest:  "{{ pi_daemon_dir }}/docker-compose.yml"
        owner: "{{ pi_user }}"
        group: "{{ pi_user }}"
        mode:  "0644"

    - name: pi-daemon neu starten
      ansible.builtin.systemd:
        name:  pi-daemon
        state: restarted

    - name: Warte bis Daemon wieder erreichbar
      ansible.builtin.wait_for:
        port:    "{{ pi_daemon_port }}"
        host:    "{{ ansible_host }}"
        delay:   10
        timeout: 180
      ignore_errors: true
      register: wait_result

    - name: Update abgeschlossen
      ansible.builtin.debug:
        msg: >-
          {% if wait_result.failed | default(false) %}
          ⚠️  Update deployt, Daemon antwortet noch nicht auf Port {{ pi_daemon_port }} – bitte manuell prüfen:
          docker logs pi-daemon
          {% else %}
          ✅ Update fertig – https://{{ inventory_hostname }}:{{ pi_daemon_port }}
          {% endif %}
