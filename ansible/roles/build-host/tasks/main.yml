---
# Richtet den lokalen Build-Rechner (Gentoo x86_64) ein:
#   - Docker CE + Buildx
#   - QEMU (User-Space, aarch64)
#   - QEMU-binfmt dauerhaft registriert (via local.d)
#
# Ausführen (einmalig, lokal als root oder mit sudo):
#   ansible-playbook playbooks/setup-build-host.yml --ask-become-pass

# ── Basics ────────────────────────────────────────────────────────────────
- name: package.accept_keywords – Docker
  ansible.builtin.lineinfile:
    path: /etc/portage/package.accept_keywords/docker
    line: "{{ item }}"
    create: true
  loop:
    - "app-containers/docker ~amd64"
    - "app-containers/docker-cli ~amd64"
    - "app-containers/docker-buildx ~amd64"
  become: true

- name: package.accept_keywords – QEMU
  ansible.builtin.lineinfile:
    path: /etc/portage/package.accept_keywords/qemu
    line: "app-emulation/qemu ~amd64"
    create: true
  become: true

- name: package.use – QEMU static-user + Abhängigkeiten
  ansible.builtin.lineinfile:
    path: /etc/portage/package.use/qemu
    line: "{{ item }}"
    create: true
  loop:
    - "app-emulation/qemu static-user"
    - "dev-libs/glib static-libs"
    - "sys-apps/attr static-libs"
    - "dev-libs/libpcre2 static-libs"
    - "sys-libs/zlib static-libs"
  become: true

# QEMU_USER_TARGETS ist eine make.conf-Variable, kein USE-Flag → gehört in
# /etc/portage/make.conf oder /etc/portage/env, NICHT in package.use.
- name: make.conf – QEMU_USER_TARGETS auf aarch64 setzen
  ansible.builtin.lineinfile:
    path: /etc/portage/make.conf
    regexp: '^QEMU_USER_TARGETS='
    line: 'QEMU_USER_TARGETS="aarch64"'
  become: true

# ── Pakete installieren ───────────────────────────────────────────────────
- name: Docker CE installieren
  community.general.portage:
    package:
      - app-containers/docker
      - app-containers/docker-cli
      - app-containers/docker-buildx
    state: present
  become: true

- name: QEMU (User-Space) installieren
  community.general.portage:
    package: app-emulation/qemu
    state: present
  become: true

# ── Docker-Dienst starten ─────────────────────────────────────────────────
- name: Docker-Dienst aktivieren (OpenRC)
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  become: true
  when: ansible_service_mgr == "openrc"

- name: Docker-Dienst aktivieren (systemd)
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  become: true
  when: ansible_service_mgr == "systemd"

# ── User zur docker-Gruppe hinzufügen ─────────────────────────────────────
- name: "{{ build_host_user }} zu docker-Gruppe hinzufügen"
  ansible.builtin.user:
    name: "{{ build_host_user }}"
    groups: docker
    append: true
  become: true

# ── binfmt_misc: ARM64 dauerhaft registrieren ─────────────────────────────
- name: binfmt_misc als Kernelmodul laden (falls nötig)
  community.general.modprobe:
    name: binfmt_misc
    state: present
  become: true

- name: binfmt_misc beim Start laden
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/binfmt_misc.conf
    line: binfmt_misc
    create: true
  become: true

# binfmt.d-Konfiguration (von systemd-binfmt beim Start geladen)
# F-Flag: binary-FD wird beim Registrieren geöffnet → funktioniert auch
# mit dynamisch gelinktem qemu-aarch64 in Container-Kontexten.
- name: binfmt.d – QEMU-aarch64-Eintrag anlegen
  ansible.builtin.copy:
    dest: /etc/binfmt.d/qemu-aarch64.conf
    content: |
      :qemu-aarch64:M:0:\x7f\x45\x4c\x46\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-aarch64:POCF
    mode: "0644"
  become: true

- name: systemd-binfmt aktivieren und starten
  ansible.builtin.systemd:
    name: systemd-binfmt
    enabled: true
    state: restarted
  become: true
  when: ansible_service_mgr == "systemd"

- name: OpenRC local.d – QEMU-binfmt Start-Skript anlegen
  ansible.builtin.copy:
    dest: /etc/local.d/qemu-binfmt.start
    mode: "0755"
    content: |
      #!/bin/sh
      # Registriert QEMU-aarch64 für binfmt_misc (Fallback für OpenRC-Systeme)
      docker run --privileged --rm tonistiigi/binfmt --install arm64
  become: true
  when: ansible_service_mgr == "openrc"

- name: QEMU-binfmt sofort registrieren (diese Sitzung)
  ansible.builtin.command:
    cmd: docker run --privileged --rm tonistiigi/binfmt --install arm64
  become: true
  changed_when: true

# ── Docker Buildx Kontext anlegen ─────────────────────────────────────────
- name: Buildx-Kontext 'pi-builder' anlegen
  ansible.builtin.command:
    cmd: docker buildx create --name pi-builder --driver docker-container
  register: buildx_create
  failed_when:
    - buildx_create.rc != 0
    - '"already exists" not in buildx_create.stderr'
  changed_when: buildx_create.rc == 0
  become: false

- name: Buildx-Kontext bootstrappen
  ansible.builtin.command:
    cmd: docker buildx inspect pi-builder --bootstrap
  changed_when: false
  become: false

- name: pi-builder als aktiven Kontext setzen
  ansible.builtin.command:
    cmd: docker buildx use pi-builder
  changed_when: false
  become: false

# ── Zusammenfassung ───────────────────────────────────────────────────────
- name: Setup abgeschlossen
  ansible.builtin.debug:
    msg:
      - "✅ Docker, QEMU (aarch64) und buildx sind eingerichtet."
      - "   Neu einloggen oder 'newgrp docker' ausführen, damit die Gruppe wirksam wird."
      - "   Danach: ./ansible/build_and_deploy.sh --install"
