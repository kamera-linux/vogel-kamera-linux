---
# Docker CE auf Raspberry Pi OS Bookworm installieren
- name: Keyring-Verzeichnis anlegen
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker GPG-Key hinzufügen (moderner Keyring-Weg)
  ansible.builtin.shell: |
    curl -fsSL https://download.docker.com/linux/debian/gpg \
      | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod 644 /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Docker APT-Repository hinzufügen
  ansible.builtin.apt_repository:
    repo: "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable"
    state: present
    filename: docker

# Docker ist bewusst auf 29.6.0 festgelegt und gegen Updates gesperrt:
# Nach einem Docker-Update gab es Probleme auf dem Pi, daraufhin wurden die
# Updates ausgesetzt. Welche Version betroffen war und was genau kaputtging,
# ist nicht dokumentiert.
#
# Auf dem Pi läuft unattended-upgrades mit Docker als erlaubter Quelle – die
# Sperre unten ist das Einzige, was automatische Docker-Updates verhindert.
#
# Sperre erst aufheben, wenn es neue Erkenntnisse gibt, und vorher manuell
# testen (pi-daemon, Powerbank-Abfrage, Grafana, Prometheus). Zurück auf
# 29.6.0: apt install docker-ce=5:29.6.0-1~debian.12~bookworm
#             docker-ce-cli=5:29.6.0-1~debian.12~bookworm --allow-downgrades
# Version hier UND hold unten gemeinsam ändern, sonst setzt Ansible sie zurück.
- name: Docker CE in stabiler Version installieren (29.6.0)
  ansible.builtin.apt:
    name:
      - docker-ce=5:29.6.0-*
      - docker-ce-cli=5:29.6.0-*
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Docker CE Pakete vor Updates sperren (apt-mark hold)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-compose-plugin

- name: User zur docker-Gruppe hinzufügen
  ansible.builtin.user:
    name: "{{ pi_user }}"
    groups: docker
    append: true

- name: Docker-Dienst aktivieren und starten
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: daemon.json erstellen (Logging + Konfiguration)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2"
      }
    owner: root
    group: root
    mode: "0644"
  notify: restart docker
