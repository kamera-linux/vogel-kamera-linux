[defaults]
inventory          = inventory/hosts.yml
roles_path         = roles
# SSH-Schlüssel und Remote-Benutzer werden aus ansible/.env via group_vars geladen.
# Eigene Werte in ansible/.env eintragen (siehe .env.example).
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = default
result_format      = yaml
gathering          = smart
fact_caching       = memory
force_color        = True
# UTF-8 für Task-Namen mit Umlauten (verhindert \u00fc-Escapes)
module_set_locale  = False

[privilege_escalation]
become      = True
become_method = sudo
become_user = root
