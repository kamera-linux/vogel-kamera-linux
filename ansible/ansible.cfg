[defaults]
inventory          = inventory/hosts.yml
roles_path         = roles
# SSH-Schlüssel und Remote-Benutzer werden aus ansible/.env via group_vars geladen.
# Eigene Werte in ansible/.env eintragen (siehe .env.example).
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = yaml
gathering          = smart
fact_caching       = memory

[privilege_escalation]
become      = True
become_method = sudo
become_user = root
